# PostgreSQL pour la production (en local, SQLite est utilisé par défaut : voir README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hadith
      POSTGRES_PASSWORD: hadith
      POSTGRES_DB: hadith
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata: {}
