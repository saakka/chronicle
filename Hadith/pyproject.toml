[project]
name = "hadith-bot"
version = "0.1.0"
description = "Assistant Hadiths & 'Ilm al-Rijal : recherche sémantique (RAG) + base structurée des narrateurs (Jarh wa Ta'dil)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
    "rapidfuzz>=3.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hadith_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
